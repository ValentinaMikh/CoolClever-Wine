name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/github-project-publish-2wgar8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Держим один деплой за раз, не отменяя уже запущенный.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement включает Pages с источником GitHub Actions, если он ещё не включён.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Прототип статический, сборка не нужна — публикуем корень репозитория.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
